<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 2 - Bootstrap Responsive Columns</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container my-4">
    <h1 class="mb-4">Bootstrap Responsive Columns</h1>

    <div class="row g-3">
      <!-- col-12 = mobile (stacked), col-md-6 = tablet (2 in a row), col-lg-4 = desktop (3 in a row) -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="column-box">Column 1</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="column-box">Column 2</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="column-box">Column 3</div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
